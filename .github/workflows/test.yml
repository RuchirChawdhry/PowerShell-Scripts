name: PowerShell scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows 11 · PowerShell 7
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install offline QR generator
        shell: pwsh
        run: Install-Module QRCodeGenerator -RequiredVersion 2.4.0 -Scope CurrentUser -Force
      - name: Parse and test scripts
        shell: pwsh
        run: ./tests/Test-Scripts.ps1

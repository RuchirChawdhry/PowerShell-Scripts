name: PowerShell scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows desktop · PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Microsoft WinApp CLI
        uses: microsoft/setup-WinAppCli@9288bd0729bd3f71e2ed1b9eb247dc91470b824e # v0.3
        with:
          version: v0.8.0
      - name: Parse and test scripts
        shell: pwsh
        run: ./tests/Test-Scripts.ps1
      - name: Decode generated QR using independent test scanner
        shell: pwsh
        run: |
          python -m pip install zxing-cpp pillow
          python -c "import zxingcpp; from PIL import Image; assert zxingcpp.read_barcode(Image.open('tests/qr-ci.png')).text == 'AarPaar QR test'"
      - name: Capture native taskbar Jump List
        shell: pwsh
        run: ./tests/Test-JumpList.ps1
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powershell-window-captures
          path: tests/*.png
          if-no-files-found: warn

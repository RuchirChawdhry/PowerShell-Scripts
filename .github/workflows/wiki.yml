name: Publish GitHub Wiki

on:
  push:
    branches: [main]
    paths: [wiki/**, .github/workflows/wiki.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Synchronize wiki pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" _wiki
          cp wiki/*.md _wiki/
          git -C _wiki config user.name github-actions[bot]
          git -C _wiki config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C _wiki add -- '*.md'
          if ! git -C _wiki diff --cached --quiet; then
            git -C _wiki commit -m 'Update PowerShell Scripts wiki'
            git -C _wiki push origin HEAD
          fi
